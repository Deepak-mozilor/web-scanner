services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      SCANNER_SECRET: ${SCANNER_SECRET}
      PORT: 3000
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    # Raise V8's heap limit (default ~2GB) — Lighthouse accumulates memory across
    # in-process runs, so a long-lived worker eventually OOMs at the default. This
    # buys headroom; pair it with a periodic `docker compose restart worker` (cron)
    # since the growth is unbounded. Lower WORKER_HEAP_MB on a small-RAM instance.
    command: node --max-old-space-size=${WORKER_HEAP_MB:-4096} dist/worker.js
    # Run multiple worker CONTAINERS for true parallelism. Each container is its
    # own process (own Chrome, own global `performance` namespace), so N replicas
    # run N scans at once safely — they all pull from the shared Redis queue,
    # which load-balances jobs across them. Prefer this over raising
    # WORKER_CONCURRENCY: on the mutex model, in-process concurrency serialises
    # anyway, so scaling replicas is what actually adds parallelism.
    # Override the count at deploy time: WORKER_REPLICAS=3 docker compose up -d
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      REDIS_URL: redis://redis:6379
      SCANNER_SECRET: ${SCANNER_SECRET}
      # Keep at 1 per container — the Lighthouse mutex serialises scans within a
      # process, so parallelism comes from replicas (above), not this value.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      # S3 offloading. Credentials come from the EC2 instance role (no keys here).
      # Requires the instance metadata hop limit to be >= 2 so the container can
      # reach IMDS from the docker bridge network — see deploy notes.
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_URL_TTL_SECONDS: ${S3_URL_TTL_SECONDS:-3600}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    depends_on:
      - redis

volumes:
  redis_data:
